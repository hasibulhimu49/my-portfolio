    <!-- Link previews (LinkedIn, Facebook, WhatsApp, X).
         After deploying, add og:image / twitter:image with the FULL URL, e.g.
         <meta property="og:image" content="https://your-domain.com/assets/images/hero-banner.jpg" /> -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohammad Hasibul Hasan | Software Engineer" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@hasibulhimu49" />
    <title>Mohammad Hasibul Hasan | Software Engineer</title>
    <script>
      // Apply the saved theme before the page paints (no light/dark flash).
      ;(function () {
        var pref = 'system'
        try {
          pref = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&family=Caveat:wght@500;600&family=Mrs+Saint+Delafield&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
